# MySQL 8.4 para el proyecto RRHH (Persistencia de Datos - Entrega 2)

name: rrhh-db

services:
  mysql:
    image: mysql:8.4
    container_name: mysql-rrhh
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      # Crea 'poli01'@'%'; los permisos los otorga init/01_setup.sql
      MYSQL_USER: poli01
      MYSQL_PASSWORD: ${POLI01_PASSWORD:?Falta POLI01_PASSWORD en .env}
      TZ: America/Bogota
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"   # solo accesible desde este PC
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro  # solo se ejecuta con el volumen vacío
    healthcheck:
      # Por TCP, para no marcar healthy mientras corre el init
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
